name: Mechanical Worlds CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run skills:check
      - run: npm run assets:validate
      - run: npm run assets:build && npm run assets:validate
      - run: npm run test
      - run: npm run build
