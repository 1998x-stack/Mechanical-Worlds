name: Mechanical Worlds Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run skills:check
      - run: npm run assets:validate
      - run: npm run test
      - run: GITHUB_PAGES=true npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CAD B-Rep kernel
        run: python -m pip install cadquery==2.8.0
      - name: Publish 18-Part B-Rep STEP and CAD-derived GLB as separate evidence-tier assets
        run: python tools/cad/generate_engine_reference.py --output dist/models

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
