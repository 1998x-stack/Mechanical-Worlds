name: Mechanical Worlds Browser GLB Smoke
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests-browser/**"
      - ".github/workflows/browser-smoke.yml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install cadquery==2.8.0
      - name: Build BRep GLB so Chromium tests actual CAD mesh replacement
        run: python tools/cad/generate_engine_reference.py --skip-step --output public/models
      - run: npm run build
      - name: Real Chromium WebGL GLB page and wheel integration smoke
        run: node tests-browser/smoke.mjs
      - name: Real Chromium acceptance (4 corners, crank phases, teardown guard, undo/redo, catalog)
        run: node tests-browser/acceptance.mjs
      - name: GitHub Pages base-subpath static hosting acceptance
        run: node tests-browser/pages-base.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automotive-playwright-smoke-screenshot
          path: |
            dist-reports/automotive-browser-smoke.png
            dist-reports/acceptance-automotive.png
            dist-reports/acceptance-index.png
            dist-reports/browser-acceptance.json
          if-no-files-found: ignore
